name: depicts
base: core22
# The version is read from depicts/__init__.py at build time (see override-pull),
# so it is defined in one place only.
adopt-info: depicts
summary: Summarize a software project for AI context.
title: Depicts – project‑summary CLI
description: |
  A Python CLI tool that summarizes a software project by outputting a directory tree
  and the contents of priority files. It helps provide instant context to AI assistants.

contact: https://github.com/bianchi-john/depicts/discussions
license: MIT
website: https://github.com/bianchi-john/depicts
source-code: https://github.com/bianchi-john/depicts
issues: https://github.com/bianchi-john/depicts/issues
donation: https://github.com/sponsors/bianchi-john
# The store icon must be a square PNG/SVG (max 512x512); the banner is for the listing page.
icon: icon/icon-512.png

grade: stable
confinement: strict

apps:
  depicts:
    command: bin/depicts
    plugs:
      - home
      - removable-media
      - x11
      - wayland

parts:
  depicts:
    plugin: python
    source: .
    # Python dependencies come from pyproject.toml.
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' depicts/__init__.py)"
    stage-packages:
      - wl-clipboard
      - xclip
      - xsel
