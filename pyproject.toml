[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "depicts"
dynamic = ["version"]
description = "Summarize a software project for AI context."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "John Bianchi" }]
keywords = ["ai", "llm", "context", "cli", "project-summary"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "PyYAML>=5.1",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
depicts = "depicts.cli:main"

[project.urls]
Homepage = "https://github.com/bianchi-john/depicts"
Issues = "https://github.com/bianchi-john/depicts/issues"

[tool.setuptools.dynamic]
version = { attr = "depicts.__version__" }

[tool.setuptools.packages.find]
include = ["depicts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
